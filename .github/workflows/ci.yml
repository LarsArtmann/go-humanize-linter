name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      GOPRIVATE: github.com/larsartmann/*
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "url.git@github.com:.insteadOf"
      GIT_CONFIG_VALUE_0: "https://github.com/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH for private repos
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Self-scan
        run: |
          go build -o /tmp/go-humanize-linter ./cmd/go-humanize-linter/
          /tmp/go-humanize-linter --quiet .

      - name: Coverage
        run: |
          mkdir -p reports
          go test ./... -coverprofile=reports/coverage.out -covermode=atomic
          go tool cover -func=reports/coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: reports/coverage.out
          flags: unittests
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      GOPRIVATE: github.com/larsartmann/*
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "url.git@github.com:.insteadOf"
      GIT_CONFIG_VALUE_0: "https://github.com/"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH for private repos
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --timeout 5m
