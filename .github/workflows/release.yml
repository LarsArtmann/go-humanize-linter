name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test ./... -race -count=1

      - name: Build CLI
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          go build -ldflags "-X main.version=${VERSION}" -o "go-humanize-linter" ./cmd/go-humanize-linter/

      - name: Build singlechecker
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          go build -ldflags "-X main.version=${VERSION}" -o "gohumanize" ./cmd/gohumanize/

      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --title "$VERSION" --generate-notes --latest
          gh release upload "$VERSION" \
            "go-humanize-linter#go-humanize-linter-$VERSION-linux-amd64" \
            "gohumanize#gohumanize-$VERSION-linux-amd64" \
            --clobber
