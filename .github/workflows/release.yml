name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      GOPRIVATE: github.com/larsartmann/*,github.com/LarsArtmann/*
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup per-repo deploy keys
        env:
          K_GHL: ${{ secrets.DEPLOY_KEY_GHL }}
          K_SDK: ${{ secrets.DEPLOY_KEY_SDK }}
          K_FINDING: ${{ secrets.DEPLOY_KEY_FINDING }}
          K_GOGF: ${{ secrets.DEPLOY_KEY_GOGF }}
          K_ERRFAM: ${{ secrets.DEPLOY_KEY_ERRFAM }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$K_GHL" > ~/.ssh/gh_gohumanize
          printf '%s\n' "$K_SDK" > ~/.ssh/gh_lintersdk
          printf '%s\n' "$K_FINDING" > ~/.ssh/gh_finding
          printf '%s\n' "$K_GOGF" > ~/.ssh/gh_gogenfilter
          printf '%s\n' "$K_ERRFAM" > ~/.ssh/gh_errorfamily
          chmod 600 ~/.ssh/gh_*
          # The go command sanitizes the environment of the git subprocesses
          # it spawns for module downloads, so ssh there does not read the
          # user ssh config. Register the Host aliases system-wide instead.
          for alias in gh_gohumanize gh_lintersdk gh_finding gh_gogenfilter gh_errorfamily; do
            {
              echo "Host $alias"
              echo "  HostName github.com"
              echo "  User git"
              echo "  IdentityFile $HOME/.ssh/$alias"
              echo "  IdentitiesOnly yes"
              echo "  StrictHostKeyChecking accept-new"
              echo ""
            } | sudo tee -a /etc/ssh/ssh_config > /dev/null
          done
          git config --global url."gh-gohumanize:larsartmann/go-humanize-linter".insteadOf "https://github.com/larsartmann/go-humanize-linter"
          git config --global url."gh-lintersdk:larsartmann/go-linter-sdk".insteadOf "https://github.com/larsartmann/go-linter-sdk"
          git config --global url."gh-finding:larsartmann/go-finding".insteadOf "https://github.com/larsartmann/go-finding"
          git config --global url."gh-gogenfilter:LarsArtmann/gogenfilter".insteadOf "https://github.com/LarsArtmann/gogenfilter"
          git config --global url."gh-errorfamily:larsartmann/go-error-family".insteadOf "https://github.com/larsartmann/go-error-family"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test ./... -race -count=1

      - name: Build CLI
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          go build -ldflags "-X main.version=${VERSION}" -o "go-humanize-linter" ./cmd/go-humanize-linter/

      - name: Build singlechecker
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          go build -ldflags "-X main.version=${VERSION}" -o "gohumanize" ./cmd/gohumanize/

      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --title "$VERSION" --generate-notes --latest
          gh release upload "$VERSION" \
            "go-humanize-linter#go-humanize-linter-$VERSION-linux-amd64" \
            "gohumanize#gohumanize-$VERSION-linux-amd64" \
            --clobber
