name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      GOPRIVATE: github.com/larsartmann/*
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "url.git@github.com:.insteadOf"
      GIT_CONFIG_VALUE_0: "https://github.com/"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup SSH for private repos
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test ./... -race -count=1

      - name: Build CLI
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          go build -ldflags "-X main.version=${VERSION}" -o "go-humanize-linter" ./cmd/go-humanize-linter/

      - name: Build singlechecker
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          go build -ldflags "-X main.version=${VERSION}" -o "gohumanize" ./cmd/gohumanize/

      - name: Upload release artifacts
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./go-humanize-linter
          asset_name: go-humanize-linter-${{ github.ref_name }}-linux-amd64
          asset_content_type: application/octet-stream

      - name: Upload singlechecker
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./gohumanize
          asset_name: gohumanize-${{ github.ref_name }}-linux-amd64
          asset_content_type: application/octet-stream
