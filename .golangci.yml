version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.jsonv2
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
linters:
  enable:
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
    - whitespace
  settings:
    funlen:
      lines: 120
      statements: 80
    gocognit:
      min-complexity: 35
    gocritic:
      disabled-checks:
        - ifElseChain
    revive:
      rules:
        - name: unused-parameter
          severity: warning
        - name: unreachable-code
          severity: warning
        - name: context-as-argument
          severity: warning
        - name: error-return
          severity: warning
        - name: error-strings
          severity: warning
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
        - name: package-comments
          severity: warning
        - name: range
          severity: warning
        - name: receiver-naming
          severity: warning
        - name: indent-error-flow
          severity: warning
        - name: errorf
          severity: warning
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - goconst
          - wrapcheck
    paths:
      - testdata/
      - vendor/
formatters:
  enable:
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    paths:
      - testdata/
      - vendor/
issues:
  max-issues-per-linter: 100
  max-same-issues: 5
